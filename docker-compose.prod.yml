# Docker Compose for Production
# Optimized for production deployment with additional configurations

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fuel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petrolimex}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fuel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: 
      - --max_connections=1000
      - --innodb_buffer_pool_size=256M
      - --log_error_verbosity=2

  # Python Service (Auto-update & Scraping)
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: fuel_python
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petrolimex}
      MYSQL_PORT: 3306
      FUEL_USERNAME: ${FUEL_USERNAME}
      FUEL_PASSWORD: ${FUEL_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./output:/app/output
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fuel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    container_name: fuel_dashboard
    restart: always
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-petrolimex}
      DB_PORT: 3306
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fuel_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql_data:
    driver: local

networks:
  fuel_network:
    driver: bridge

