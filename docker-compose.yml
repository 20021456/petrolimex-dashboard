services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fuel_mysql
    restart: unless-stopped
    command: 
      - --skip-ssl
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-minhtrung02}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petrolimex}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Ho_Chi_Minh
    volumes:
      # Data persistence - Dữ liệu MySQL được lưu vĩnh viễn
      - mysql_data:/var/lib/mysql
      # Backup folder - Mount folder để backup dễ dàng
      - ./mysql_backups:/backups
    # ===========================================
    # 📦 LẤY DỮ LIỆU MYSQL:
    # ===========================================
    # Option 1: Truy cập MySQL từ bên ngoài (Uncomment dòng dưới)
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"
    # Sau đó dùng MySQL Workbench/DBeaver kết nối: localhost:3306
    #
    # Option 2: Backup vào folder ./mysql_backups/
    # docker exec fuel_mysql mysqldump -uroot -p${MYSQL_ROOT_PASSWORD} ${MYSQL_DATABASE} > mysql_backups/backup_$(date +%Y%m%d).sql
    #
    # Option 3: Restore từ backup
    # docker exec -i fuel_mysql mysql -uroot -p${MYSQL_ROOT_PASSWORD} ${MYSQL_DATABASE} < mysql_backups/backup_YYYYMMDD.sql
    # ===========================================
    networks:
      - fuel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pminhtrung02"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  # Python Service (Auto-update & Scraping + API Server)
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: fuel_python
    restart: unless-stopped
    environment:
      # MySQL Config
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-minhtrung02}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petrolimex}
      MYSQL_PORT: 3306
      # Fuel Credentials
      FUEL_USERNAME: ${FUEL_USERNAME:-htxthanhsonna}
      FUEL_PASSWORD: ${FUEL_PASSWORD:-thanhson@123}
      # API Server
      API_PORT: 5000
    volumes:
      - ./src:/app/src
      - ./dags:/app/dags
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fuel_network
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Next.js Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    container_name: fuel_dashboard
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-minhtrung02}
      DB_NAME: ${MYSQL_DATABASE:-petrolimex}
      DB_PORT: 3306
      NODE_ENV: production
      # MySQL client config via environment variable
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-minhtrung02}
      # Python API URL (để gọi cập nhật dữ liệu)
      PYTHON_API_URL: http://python:5000
      DOCKER_ENV: "true"
    # For Dokploy: use expose instead of ports (Dokploy handles routing via Traefik)
    # For local: uncomment ports and comment expose
    expose:
      - "3000"
    # ports:
    #   - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      python:
        condition: service_healthy
    networks:
      - fuel_network

volumes:
  # MySQL Data Volume - Lưu trữ dữ liệu database vĩnh viễn
  # Location: Docker volume (có thể xem bằng: docker volume inspect fuel-revenue-oimsud_mysql_data)
  # Để export volume: docker run --rm -v fuel-revenue-oimsud_mysql_data:/data -v $(pwd):/backup alpine tar czf /backup/mysql_data_backup.tar.gz -C /data .
  # Để import volume: docker run --rm -v fuel-revenue-oimsud_mysql_data:/data -v $(pwd):/backup alpine tar xzf /backup/mysql_data_backup.tar.gz -C /data
  mysql_data:

networks:
  fuel_network:
    driver: bridge

