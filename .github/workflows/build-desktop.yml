name: Build Desktop App (Windows)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Địa chỉ dashboard nhúng sẵn vào app (vd https://fuel.tencongty.com hoặc http://14.225.1.2:3000). Bỏ trống thì app hỏi khi mở lần đầu.'
        required: false
        default: ''
  push:
    tags:
      - 'desktop-v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Nhúng địa chỉ máy chủ mặc định
        if: inputs.server_url != ''
        working-directory: desktop
        env:
          SERVER_URL: ${{ inputs.server_url }}
        run: Set-Content -Path default-server.txt -Value $env:SERVER_URL -NoNewline

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Build installer
        working-directory: desktop
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetrolimexDashboard-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true
