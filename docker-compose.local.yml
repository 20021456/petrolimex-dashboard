services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fuel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-minhtrung02}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petrolimex}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_backups:/backups
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - fuel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-minhtrung02}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Python Service
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: fuel_python
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-minhtrung02}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petrolimex}
      MYSQL_PORT: 3306
      FUEL_USERNAME: ${FUEL_USERNAME:-htxthanhsonna}
      FUEL_PASSWORD: ${FUEL_PASSWORD:-thanhson@123}
    volumes:
      - ./output:/app/output
      - ./database:/app/database
      - ./scripts:/app/scripts
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fuel_network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import mysql.connector; mysql.connector.connect(host=\"mysql\", user=\"root\", password=\"${MYSQL_ROOT_PASSWORD:-minhtrung02}\", database=\"${MYSQL_DATABASE:-petrolimex}\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Next.js Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
    container_name: fuel_dashboard
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-minhtrung02}
      DB_NAME: ${MYSQL_DATABASE:-petrolimex}
      DB_PORT: 3306
      NODE_ENV: production
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      python:
        condition: service_healthy
    networks:
      - fuel_network

volumes:
  mysql_data:

networks:
  fuel_network:
    driver: bridge


